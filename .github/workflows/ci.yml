name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Секреты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверка на секреты в отслеживаемых файлах
        run: ./scripts/check-secrets.sh

  backend:
    name: Бэкенд и движок процессов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: dotnet build CrmVova.slnx --configuration Release

      - name: Тесты движка процессов
        run: dotnet run --project tests/Crm.Bpm.Tests --configuration Release --no-build

      - name: Сквозной сценарий через API
        run: ./scripts/ci-smoke.sh

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы и сборка
        run: npm run build

  image:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Только сборка, без публикации: проверяем, что образ собирается.
      # Публикацию в реестр добавим, когда будет известна площадка хостинга.
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: crm-vova:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка, что контейнер отдаёт SPA и API
        run: |
          docker run -d --name crm -p 8080:8080 crm-vova:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/stages >/dev/null 2>&1 && break
            sleep 1
          done
          python3 scripts/smoke.py http://localhost:8080
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)" = "404"
          docker rm -f crm

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Бэкенд и движок процессов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: dotnet build CrmVova.slnx --configuration Release

      - name: Тесты движка процессов
        run: dotnet run --project tests/Crm.Bpm.Tests --configuration Release --no-build

      - name: Сквозной сценарий через API
        run: ./scripts/ci-smoke.sh

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы и сборка
        run: npm run build

# PostgreSQL for the next stage: the current build keeps data in memory,
# the EF Core adapters land behind the same IRepository ports.
services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-vova-postgres
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5433:5432"
    volumes:
      - crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm-pgdata:
